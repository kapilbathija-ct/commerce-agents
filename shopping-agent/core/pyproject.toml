[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopping-agent-core"
# Fork provenance marker. A PEP 440 local version label: `==0.1.0.dev0` in the sibling
# packages ignores it, so the fork still satisfies their pins, while `pip list` and
# `direct_url.json` both show which build is installed. No behaviour is changed here.
version = "0.1.0.dev0+ct.fork.1"
description = "The shopping agent's library: types, the StorefrontBackend interface, prompt, tool contracts, gates, and the executor every runtime calls."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = ["License :: OSI Approved :: Apache Software License"]
authors = [{ name = "Anthropic" }]
# Sibling packages are pinned to this exact dev version: install them together from
# the repo (scripts/install.sh); a lone install fails instead of resolving a public
# distribution of the same name.
dependencies = [
  "commerce-common==0.1.0.dev0",
  "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["shopping_agent"]
